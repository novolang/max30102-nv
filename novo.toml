[package]
name        = "max30102-nv"
version     = "0.1.0"
description = "A driver for the Maxim (Analog Devices) MAX30102 pulse oximeter and heart-rate sensor on an I2C bus: the part ID check and reset, the FIFO with its pointers, overflow counter, averaging, roll-over and almost-full interrupt, the heart-rate and SpO2 modes, the LED pulse amplitudes, pulse width and ADC range, the die temperature, the raw red and infrared counts, and a beat detector over the infrared channel, as devices-nv's HeartRate and Identifiable."
license     = "Apache-2.0"
stability   = "experimental"
category    = "embedded"
layer       = "host"
tags        = ["max30102", "max30101", "pulse-oximeter", "heart-rate", "ppg", "i2c", "sensor", "nrf52840-dk", "nrf54lm20-dk"]
repository  = "https://github.com/novolang/max30102-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.24.0"

# The package is checked at the embedded tier, the strictest one, so
# every function in it is also valid at rt and system.
[tier]
tier = "embedded"

[docs.pages]
"README.md" = "Reading a MAX30102 pulse sensor from a device program"

[dependencies]
# The board's I2C bus, GPIO and timer handles, and the I2cBus and
# GpioOut traits they implement.
embedded-hal-nv = "^0.3.2"
# The HeartRate and Identifiable traits, the wiring record a board's
# device table hands `attach`, and the register helpers.
devices-nv      = { path = "../devices-nv" }
